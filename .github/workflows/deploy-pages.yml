name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/reaction-time-web-app-vob2h4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: Firebase config 파일 생성(시크릿 값 주입)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cat > js/firebase-config.js << EOF
          // 이 파일은 배포 시 GitHub Actions 시크릿 값으로 자동 생성됩니다.
          // 로컬 저장소의 원본 파일(placeholder)은 커밋된 상태 그대로 유지됩니다.
          export const firebaseConfig = {
            apiKey: "$FIREBASE_API_KEY",
            authDomain: "$FIREBASE_AUTH_DOMAIN",
            projectId: "$FIREBASE_PROJECT_ID",
            storageBucket: "$FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "$FIREBASE_MESSAGING_SENDER_ID",
            appId: "$FIREBASE_APP_ID",
          };
          EOF

      - name: 배포용 아티팩트 업로드(정적 파일 전체)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
